<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Family Jobs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --ink: #1f1d1a; --muted: #6b665e; --line: #e3ded4;
    --accent: #2f6df6; --accent-ink: #ffffff; --warn: #b45309; --warn-bg: #fff4e0;
    --busy: #b91c1c; --busy-bg: #fde8e8; --cover: #0f766e; --cover-bg: #e0f5f2;
    --backup: #1d4ed8; --backup-bg: #e3ebff; --today: #fff7cc;
    --c-k0: #dc2626; --c-k1: #db2777; --c-k2: #16a34a; --c-k3: #2563eb; --c-k4: #d97706; --c-k5: #0d9488;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181b; --card: #222428; --ink: #f1efe9; --muted: #a39e94; --line: #34373d;
      --accent: #6b9bff; --accent-ink: #0b1020; --warn: #fbbf24; --warn-bg: #3a2a08;
      --busy: #fca5a5; --busy-bg: #4a1d1d; --cover: #5eead4; --cover-bg: #0f3d38;
      --backup: #9db8ff; --backup-bg: #1e2b4d; --today: #3d3612;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.4 "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; }
  .brand { font-weight: 700; font-size: 20px; }
  .me { color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 6px; }
  .me select { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }

  .tabs { display: flex; gap: 4px; padding: 0 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 5; }
  .tabs button { flex: 1; background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 4px; color: var(--muted); font-weight: 600; }
  .tabs button.active { color: var(--ink); border-bottom-color: var(--accent); }

  main { max-width: 820px; margin: 0 auto; padding: 16px; }
  .loading, .error { text-align: center; color: var(--muted); padding: 40px 0; }
  .error { color: var(--busy); }

  .nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .nav h2 { margin: 0; font-size: 18px; text-align: center; flex: 1; }
  .nav .sub { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
  .btn { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .btn.small { padding: 5px 10px; font-size: 14px; }
  .btn.danger { color: var(--busy); }
  .btn[disabled] { opacity: .5; cursor: default; }

  .banner { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; margin-bottom: 12px; }
  .banner.backup { background: var(--backup-bg); color: var(--backup); font-weight: 600; }
  .banner.busy { background: var(--busy-bg); color: var(--busy); }
  .banner .grow { flex: 1; }

  .cards { display: grid; gap: 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
  .card .icon { font-size: 30px; width: 40px; text-align: center; }
  .card .job { font-size: 20px; font-weight: 700; color: var(--ink); line-height: 1.3; }
  .card .job .jicon { font-size: 24px; line-height: 1; vertical-align: -2px; }
  .card .who { font-size: inherit; font-weight: inherit; }
  .card .grow { flex: 1; min-width: 0; }
  .card .sub { margin-top: 6px; }
  .card.mine { outline: 2px solid var(--accent); }
  .card.cover .who { color: var(--cover); }
  .tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
  .tag.cover { background: var(--cover-bg); color: var(--cover); }
  .tag.busy { background: var(--busy-bg); color: var(--busy); white-space: nowrap; }
  .card .who .was { color: var(--muted); font-weight: 500; }
  .tag.backup { background: var(--backup-bg); color: var(--backup); font-size: 16px; padding: 5px 12px; line-height: 1.3; }

  .chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 10px; font-weight: 600; font-size: 14px; background: var(--card); border: 1px solid var(--line); }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: var(--muted); }
  .dot.k0 { background: var(--c-k0); } .dot.k1 { background: var(--c-k1); } .dot.k2 { background: var(--c-k2); }
  .dot.k3 { background: var(--c-k3); } .dot.k4 { background: var(--c-k4); } .dot.k5 { background: var(--c-k5); }

  .tablewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
  table.grid { border-collapse: collapse; width: 100%; min-width: 640px; }
  table.grid th, table.grid td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 8px 6px; text-align: center; vertical-align: middle; }
  table.grid th:first-child, table.grid td:first-child { text-align: left; position: sticky; left: 0; background: var(--card); min-width: 130px; font-weight: 600; }
  table.grid tr:last-child td { border-bottom: 0; }
  table.grid th:last-child, table.grid td:last-child { border-right: 0; }
  table.grid th.day { cursor: pointer; }
  table.grid th.day .d { display: block; font-weight: 700; }
  table.grid th.day .n { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
  table.grid th.day.today, table.grid td.today { background: var(--today); }
  table.grid td.cell { cursor: pointer; }
  table.grid td .name { font-weight: 600; }
  table.grid td .for { display: block; font-size: 11px; color: var(--cover); }
  table.grid td .bk { display: block; font-size: 14px; font-weight: 600; color: var(--backup); }
  table.grid td.cover .name { color: var(--cover); }
  table.grid td.fallback .name { color: var(--warn); }
  table.grid tr.backup td { background: var(--backup-bg); color: var(--backup); }
  table.grid tr.backup td:first-child { background: var(--backup-bg); }
  table.grid td .busyline { display: block; font-size: 11px; color: var(--busy); }
  .legend { color: var(--muted); font-size: 13px; margin-top: 10px; }
  .legend span { margin-right: 12px; }

  .section { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  .section h3 { margin: 0 0 10px; font-size: 16px; }
  .section p.help { color: var(--muted); font-size: 13px; margin: 6px 0 10px; }
  .field { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: center; margin-bottom: 8px; }
  .field label { color: var(--muted); font-size: 14px; }
  .field input, .field select, .field textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .field.full { grid-template-columns: 1fr; }
  .checks { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .checks label { display: inline-flex; align-items: center; gap: 6px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .note { color: var(--muted); font-size: 13px; }
  .note.warn { color: var(--warn); background: var(--warn-bg); padding: 8px 10px; border-radius: 8px; }
  .ok { color: var(--cover); }

  .sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
  .sheet { background: var(--card); border-radius: 18px 18px 0 0; width: 100%; max-width: 560px; padding: 16px; max-height: 88vh; overflow: auto; }
  .sheet h3 { margin: 0 0 4px; }
  .sheet .who-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
  .sheet .who-list button { border: 2px solid var(--line); background: var(--bg); border-radius: 12px; padding: 12px; font-weight: 600; font-size: 16px; }
  .sheet .who-list button.busy { border-color: var(--busy); background: var(--busy-bg); color: var(--busy); }
  .sheet .preview { font-size: 14px; color: var(--muted); margin: 8px 0 12px; }
  .sheet .preview b { color: var(--cover); }
  .sheet .actions { display: flex; justify-content: flex-end; gap: 8px; }

  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 30; max-width: 90vw; font-size: 14px; white-space: pre-line; }
  .toast.err { background: var(--busy); color: #fff; }

  @media (max-width: 480px) {
    .brand { font-size: 18px; }
    .field { grid-template-columns: 1fr; }
    .card .who { font-size: 20px; }
  }
</style>

</head>
<body>
  <header class="top">
    <div class="brand">🧹 Family Jobs</div>
    <label class="me">I am
      <select id="meSelect"></select>
    </label>
  </header>

  <nav class="tabs" id="tabs">
    <button data-view="today" class="active">Today</button>
    <button data-view="week">Week</button>
    <button data-view="rota">Rota</button>
    <button data-view="settings">Settings</button>
  </nav>

  <main id="main"><div class="loading">Loading…</div></main>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script>
/*
 * RotaLib — the rota rules. One file, three homes:
 *   - served to the browser (Index.html includes it) so the UI can draw any week instantly
 *   - loaded by Code.gs on the server (for Calendar sync and emails)
 *   - loaded by test/rota.test.js under node
 * Keep it plain JS with no Apps Script or DOM APIs.
 */
var Rota = (function () {
  'use strict';

  // The job list IS the rotation: each child moves one place along it every Monday.
  // Order set on 21 Sep 2026: High, Easy, Medium, Easy, High, Medium, so no two hard
  // weeks touch. The `backup` field names the job whose holder is that job's backup.
  // Since 12 Oct 2026 the Floors, Bathrooms and Washing holders are the backups: each
  // covers one heavier job and one of the other light jobs, so Washing Up, Table &
  // Sides and Dishwasher holders have no backup duty. A job is never backed by the
  // holder of the job one place before it, because that child did this job last week
  // (rule of 19 Oct 2026).
  var JOBS = [
    { id: 'washing-up', name: 'Washing Up',               icon: '🧽', load: 'High',   backup: 'bathrooms' },
    { id: 'floors',     name: 'Floors',                   icon: '🧹', load: 'Easy',   backup: 'washing' },
    { id: 'surfaces',   name: 'Table & Sides & Sofas',    icon: '🛋️', load: 'Medium', backup: 'washing' },
    { id: 'bathrooms',  name: 'Bathrooms',                icon: '🚿', load: 'Easy',   backup: 'floors' },
    { id: 'dishwasher', name: 'Dishwasher and Drying Up', icon: '🍽️', load: 'High',   backup: 'floors' },
    { id: 'washing',    name: 'Washing',                  icon: '👕', load: 'Medium', backup: 'bathrooms' }
  ];

  // The children in rotation order: child i holds JOBS[i - weekOffset] in week 0.
  // Deliberately empty here: this file is published with the GitHub Pages copy, so the
  // names live only in Code.gs, which fills them in with setKids() and sends them to
  // the page in getBootstrap.
  var KIDS = [];

  /** Replace the children list in place, so every holder of Rota.KIDS sees it. */
  function setKids(list) {
    KIDS.length = 0;
    (list || []).forEach(function (n) { KIDS.push(String(n)); });
    return KIDS;
  }

  var DEFAULTS = {
    epoch: '2026-09-14',        // a Monday: week 0 of the rotation starts here
    weekOffset: 0,              // nudge which job everyone starts on
    backupOffset: 0,            // nudge who is backup first
    fallback: 'Mum/Dad',        // the final backups
    coverMode: 'parents',       // 'parents': backup covers one busy child, Mum & Dad cover anything more
                                // 'cascade': backup, then the next child in rotation, ... then Mum & Dad
    calendarId: '563662e1011da34f250d47d7a02c3d36fc6aa98b73d8de3be81c7f69cf471c2f@group.calendar.google.com', // the family calendar
    calendarWeeksAhead: 4,      // one Mon–Sun event per week
    dailyEmail: true,           // email each child their jobs every morning (daily sync)
    people: {}                  // { 'someone@gmail.com': '<child>' }  (lower-case emails)
  };

  function mod(n, m) { return ((n % m) + m) % m; }
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function parse(iso) {
    var p = String(iso).split('-');
    return Date.UTC(+p[0], +p[1] - 1, +p[2]);
  }
  function toIso(ms) {
    var d = new Date(ms);
    return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
  }
  function isValidIso(iso) {
    return /^\d{4}-\d{2}-\d{2}$/.test(String(iso)) && !isNaN(parse(iso));
  }
  function addDays(iso, n) { return toIso(parse(iso) + n * 86400000); }
  function diffDays(a, b) { return Math.round((parse(a) - parse(b)) / 86400000); }

  /** Monday of the week containing iso. */
  function weekStart(iso) {
    var dow = (new Date(parse(iso)).getUTCDay() + 6) % 7; // Mon=0 .. Sun=6
    return addDays(iso, -dow);
  }

  /** Today's date in the browser's local zone (the server passes its own). */
  function localToday(d) {
    d = d || new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function withDefaults(cfg) {
    var out = {};
    Object.keys(DEFAULTS).forEach(function (k) {
      out[k] = (cfg && cfg[k] !== undefined && cfg[k] !== null) ? cfg[k] : DEFAULTS[k];
    });
    if (!isValidIso(out.epoch)) out.epoch = DEFAULTS.epoch;
    out.epoch = weekStart(out.epoch);
    out.weekOffset = parseInt(out.weekOffset, 10) || 0;
    out.backupOffset = parseInt(out.backupOffset, 10) || 0;
    out.calendarWeeksAhead = Math.min(26, Math.max(1, parseInt(out.calendarWeeksAhead, 10) || DEFAULTS.calendarWeeksAhead));
    if (out.coverMode !== 'cascade') out.coverMode = 'parents';
    if (!String(out.fallback).trim() || out.fallback === 'Mum & Dad') out.fallback = DEFAULTS.fallback;
    out.calendarId = String(out.calendarId || '').trim() || DEFAULTS.calendarId;
    out.dailyEmail = out.dailyEmail !== false && out.dailyEmail !== 'false';
    if (typeof out.people !== 'object' || out.people === null || Array.isArray(out.people)) out.people = {};
    var people = {};
    Object.keys(out.people).forEach(function (email) {
      var e = String(email).trim().toLowerCase();
      if (e && KIDS.indexOf(out.people[email]) >= 0) people[e] = out.people[email];
    });
    out.people = people;
    return out;
  }

  function dayIndex(iso, cfg) { return diffDays(iso, cfg.epoch); }
  function weekIndex(iso, cfg) { return Math.floor(dayIndex(iso, cfg) / 7) + (cfg.weekOffset || 0); }

  /** Who owns job j (index) in week w: everyone moves one job along each week. */
  function ownerOf(jobIndex, week) { return KIDS[mod(jobIndex - week, KIDS.length)]; }

  /** Index of the job whose holder backs up job j (see JOBS[].backup). */
  function backupJobIndex(jobIndex) {
    var id = JOBS[mod(jobIndex, JOBS.length)].backup;
    for (var i = 0; i < JOBS.length; i++) if (JOBS[i].id === id) return i;
    return mod(jobIndex + 1, JOBS.length);
  }

  /** Who backs up job j (index) on a date: fixed for the whole week. */
  function backupOf(jobIndex, iso, cfg) {
    return ownerOf(backupJobIndex(jobIndex), weekIndex(iso, cfg));
  }

  /**
   * Full plan for one day.
   * busyNames: array of children who are busy that day.
   *
   * Rules:
   *  - every child keeps their weekly job unless they are busy
   *  - every job has its own backup child (see JOBS[].backup); the backup does the
   *    job when its owner is busy
   *  - a busy child never covers
   *  - coverMode 'parents' (default): if the job's backup is busy too, Mum & Dad
   *    (cfg.fallback) do it. They are the final backups.
   *  - coverMode 'cascade': the next child along the shift order steps in before
   *    Mum & Dad.
   */
  function planDay(iso, cfg, busyNames) {
    cfg = withDefaults(cfg);
    var busy = (busyNames || []).filter(function (n) { return KIDS.indexOf(n) >= 0; });
    var isBusy = function (n) { return busy.indexOf(n) >= 0; };
    var week = weekIndex(iso, cfg);
    var cascade = cfg.coverMode === 'cascade';

    var assignments = JOBS.map(function (job, j) {
      var owner = ownerOf(j, week);
      var bj = backupJobIndex(j);
      var backup = ownerOf(bj, week);
      var a = { job: job, owner: owner, backup: backup, doer: owner, coveredFor: null };
      if (!isBusy(owner)) return a;
      a.coveredFor = owner;
      a.doer = cfg.fallback;
      if (!isBusy(backup)) a.doer = backup;
      else if (cascade) {
        for (var k = 1; k < KIDS.length - 1; k++) {
          var next = ownerOf(bj + k, week);
          if (next !== owner && !isBusy(next)) { a.doer = next; break; }
        }
      }
      return a;
    });

    return { date: iso, week: week, busy: busy, assignments: assignments };
  }

  /** "<child>/Mum/Dad": the job's backup child, then the final backups. */
  function backupLabel(a, cfg) {
    return a.backup + '/' + withDefaults(cfg).fallback;
  }

  /** Jobs a child is backup for on a date. */
  function backupsFor(name, iso, cfg, busyNames) {
    return planDay(iso, cfg, busyNames).assignments.filter(function (a) { return a.backup === name; });
  }

  /** busyMap: { 'YYYY-MM-DD': ['<child>', ...] } */
  function planRange(fromIso, days, cfg, busyMap) {
    cfg = withDefaults(cfg);
    busyMap = busyMap || {};
    var out = [];
    for (var i = 0; i < days; i++) {
      var iso = addDays(fromIso, i);
      out.push(planDay(iso, cfg, busyMap[iso]));
    }
    return out;
  }

  /** The job a child holds in a given week. */
  function jobFor(name, iso, cfg) {
    cfg = withDefaults(cfg);
    var week = weekIndex(iso, cfg);
    return JOBS[mod(KIDS.indexOf(name) + week, JOBS.length)];
  }

  /** Email addresses recorded for a child (may be empty). */
  function emailsFor(name, cfg) {
    cfg = withDefaults(cfg);
    return Object.keys(cfg.people).filter(function (e) { return cfg.people[e] === name; });
  }

  /**
   * The morning email for one child: { subject, text, lines }.
   * Their job today, whether they are backup, who they are covering, and the week ahead.
   */
  function emailFor(name, iso, cfg, busyMap) {
    cfg = withDefaults(cfg);
    busyMap = busyMap || {};
    var day = planDay(iso, cfg, busyMap[iso]);
    var busyToday = day.busy.indexOf(name) >= 0;
    var mine = day.assignments.filter(function (a) { return a.doer === name; });
    // a busy child is not available as backup, so no backup duty is mentioned that day
    var backing = busyToday ? [] : day.assignments.filter(function (a) { return a.backup === name && a.doer !== name; });
    var lines = ['Hi ' + name + ',', '', 'Today, ' + fmt(iso, 'long') + ':'];

    // Names of who is being covered are deliberately left out of the email.
    if (day.busy.indexOf(name) >= 0) {
      lines.push('- You are marked busy today; your job is covered.');
    }
    // main job first, then anything they are covering
    mine.filter(function (a) { return !a.coveredFor; }).forEach(function (a) {
      lines.push('- ' + a.job.icon + ' ' + a.job.name + ' (your backup is ' + backupLabel(a, cfg) + ')');
    });
    mine.filter(function (a) { return a.coveredFor; }).forEach(function (a) {
      lines.push('- ' + a.job.icon + ' ' + a.job.name + ' (You and ' + cfg.fallback + ' are covering)');
    });
    backing.forEach(function (a) {
      lines.push('- 🛟 Backup for ' + a.job.name);
    });

    // the week ahead: who I back up, grouped into runs of days
    var ws = weekStart(iso);
    var runs = [];
    for (var i = 0; i < 7; i++) {
      var d = addDays(ws, i);
      var b = (busyMap[d] || []).indexOf(name) >= 0
        ? 'busy'
        : backupsFor(name, d, cfg, busyMap[d]).map(function (a) { return a.job.name; }).join(' and ');
      var last = runs[runs.length - 1];
      if (last && last.what === b) last.to = d; else runs.push({ what: b, from: d, to: d });
    }
    lines.push('', 'This week your job is ' + jobFor(name, ws, cfg).name + '.');
    if (runs.every(function (r) { return !r.what || r.what === 'busy'; })) {
      lines.push('You are not backup this week.');
    } else {
      lines.push('You are backup for:');
      runs.forEach(function (r) {
        var span = r.from === r.to ? fmt(r.from, 'short') : fmt(r.from, 'short') + '–' + fmt(r.to, 'short');
        lines.push('- ' + span + ': ' + (r.what || 'nobody'));
      });
    }
    lines.push('', 'Next week: ' + jobFor(name, addDays(ws, 7), cfg).name + '.');

    // Subject: own job, then the job they are backup for, always marked (Backup) so they
    // know they may have to stand in even when nobody is busy yet.
    var own = mine.filter(function (a) { return !a.coveredFor; }).map(function (a) { return a.job.name; }).join(' + ');
    var backupJobs = busyToday ? '' : day.assignments.filter(function (a) { return a.backup === name; }).map(function (a) { return a.job.name; }).join(', ');
    var subject = "Today's Job  -  " + fmt(iso) + ': ' + (own || (busyToday ? 'Busy' : 'nothing to do')) +
      (backupJobs ? ' +  ' + backupJobs + ' (Backup)' : '');
    return { subject: subject, text: lines.join('\n'), lines: lines };
  }

  function jobById(id) {

// Remote transport for the GitHub Pages copy of the app: replaces google.script.run

(function () {

  var asking = null;
  /** A small PIN screen; resolves once a PIN has been entered (checked by the next request). */
  function askPin(msg) {
    if (asking) return asking;
    asking = new Promise(function (resolve) {
      var o = document.createElement('div');
      o.style.cssText = 'position:fixed;inset:0;z-index:9999;background:var(--bg,#f6f4ef);display:flex;align-items:center;justify-content:center;padding:16px';
      o.innerHTML = '<form style="background:var(--card,#fff);border:1px solid var(--line,#e3ded4);border-radius:14px;padding:22px;max-width:320px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;font-family:inherit">' +
        '<div style="font-size:22px;font-weight:700">🧹 Family Jobs</div><div style="color:var(--muted,#6b665e)">' + (msg || 'Enter the family PIN.') + '</div>' +
        '<input type="password" inputmode="numeric" autocomplete="off" aria-label="PIN" placeholder="PIN" style="font-size:22px;text-align:center;letter-spacing:.3em;padding:10px;border:1px solid var(--line,#e3ded4);border-radius:8px">' +
        '<button type="submit" style="padding:10px;border:0;border-radius:8px;background:var(--accent,#2f6df6);color:var(--accent-ink,#fff);font-weight:700;font-size:15px">Open</button></form>';
      document.body.appendChild(o);
      var input = o.querySelector('input');
      setTimeout(function () { input.focus(); }, 50);
      o.querySelector('form').addEventListener('submit', function (e) {
        e.preventDefault();
        if (!input.value.trim()) return;
        setPin(input.value.trim()); o.remove(); asking = null; resolve();
      });
    });
    return asking;
  }
  function call(fn, args, tries) {
    tries = tries || 0;
    return fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn: fn, args: args, pin: getPin() }), redirect: 'follow' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.ok && j.code === 'pin' && tries < 5) {
          var msg = getPin() ? 'That PIN is not right. Try again.' : 'Enter the family PIN.';
          if (/too many/i.test(j.error || '')) msg = j.error;
          setPin('');
          return askPin(msg).then(function () { return call(fn, args, tries + 1); });

      });

    var r = {
      withSuccessHandler: function (f) { return runner(f, err); },
      withFailureHandler: function (f) { return runner(ok, f); }
    };

      r[name] = function () {
        call(name, [].slice.call(arguments)).then(function (out) { ok && ok(out); }, function (e) { err ? err(e) : console.error(e); });

      var nb = ev.target.closest('button[data-name]');
      if (nb) {
        var n = nb.dataset.name, i = sel.indexOf(n);
        if (i >= 0) sel.splice(i, 1); else sel.push(n);
        draw();
        return;
      }
      var xb = ev.target.closest('button[data-x]');
      if (!xb) return;
      if (xb.dataset.x === 'cancel') { back.hidden = true; return; }
      xb.disabled = true;
      rpc('setBusyDay', iso, sel).then(function (map) {
        S.busy = map || {};
        back.hidden = true;
        toast(sel.length ? sel.join(', ') + ' marked busy on ' + Rota.fmt(iso) : 'Nobody busy on ' + Rota.fmt(iso));
        render();
      }).catch(function (e) { xb.disabled = false; fail(e); });
    };
    back.onclick = function (ev) { if (ev.target === back) back.hidden = true; };
  }

  // ------------------------------------------------------------- actions

  function bind(root) {
    root.onclick = function (ev) {
      var el = ev.target.closest('[data-act]');
      if (!el) return;
      var act = el.dataset.act;
      if (act === 'day') { S.day = Rota.addDays(S.day, +el.dataset.n); render(); }
      else if (act === 'today') { S.day = S.today; render(); }
      else if (act === 'week') { S.week = Rota.addDays(S.week, 7 * +el.dataset.n); render(); }
      else if (act === 'thisweek') { S.week = Rota.weekStart(S.today); render(); }
      else if (act === 'sheet') openSheet(el.dataset.date);
      else if (act === 'saveSettings') saveSettings();
      else if (act === 'syncCal') busyButton(el, function () {
        return saveSettings(function () {
          return rpc('syncCalendar').then(function (r) {
            toast('Calendar "' + r.calendar + '" updated for ' + r.weeks + ' weeks\n' + r.created + ' added · ' + r.updated + ' changed · ' + r.deleted + ' removed');
            render();
          });
        });
      });
      else if (act === 'unGuest') {
        if (!confirm('Remove every child from the guest list of the app\'s calendar events? No emails are sent.')) return;
        busyButton(el, function () { return rpc('removeGuestsFromAppEvents').then(function (r) { toast(r.guestsRemoved + ' guest entries removed from ' + r.events + ' events, silently'); }); });
      }
      else if (act === 'clearCal') {
        if (!confirm('Remove every event this app created from the calendar?')) return;
        busyButton(el, function () { return rpc('clearCalendar').then(function (r) { toast(r.deleted + ' events removed'); }); });
      }
      else if (act === 'sendEmails') busyButton(el, function () {
        return saveSettings(function () {
          return rpc('sendJobEmails', S.today).then(function (r) {
            toast(r.sent.length ? 'Emailed ' + r.sent.join(', ') + (r.skipped.length ? '\nNo address for ' + r.skipped.join(', ') : '') : 'Nobody has an email address yet', !r.sent.length);
            render();
          });
        });
      });
      else if (act === 'trigger') busyButton(el, function () {
        return saveSettings(function () {
          return rpc(el.dataset.on === '1' ? 'installDailyTrigger' : 'removeDailyTrigger').then(function (r) {
            S.boot.dailyTrigger = !!r.installed;
            toast(r.installed ? 'Daily sync turned on' : 'Daily sync turned off');
            render();
          });
        });
      });
    };
  }

  function busyButton(el, work) {
    var label = el.textContent;
    el.disabled = true; el.textContent = 'Working…';
    Promise.resolve().then(work).catch(fail).then(function () {
      if (document.body.contains(el)) { el.disabled = false; el.textContent = label; }
    });
  }

  boot();
})();
</script>

</body>
